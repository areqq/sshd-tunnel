name: vpn-client

# Static multi-arch DSVPN, patched to leave the device's system configuration
# alone. Separate from the client and server workflows for the same reason
# those are separate from each other: it builds only when vpn-client/ changes
# or a vpn-client-v* tag is pushed, and releases under that tag prefix, so no
# two tag namespaces trigger each other.

on:
  push:
    branches: [main]
    paths: ['vpn-client/**', '.github/workflows/vpn-client.yml']
    tags: ['vpn-client-v*']
  pull_request:
    paths: ['vpn-client/**', '.github/workflows/vpn-client.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686, armv7, armv5, aarch64, mips, mipsel]
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential xz-utils qemu-user-static file binutils >/dev/null

      # The same Bootlin toolchains client/ uses, under the same cache keys, so
      # the two workflows share one download per architecture.
      - name: Cache the Bootlin toolchain
        uses: actions/cache@v4
        with:
          path: vpn-client/toolchain
          key: bootlin-vpn-${{ matrix.arch }}-2025.08-1

      - name: Cache the DSVPN source
        uses: actions/cache@v4
        with:
          path: vpn-client/src-cache
          key: dsvpn-src-master

      - name: Build
        run: vpn-client/build.sh ${{ matrix.arch }}

      - name: Show the result
        run: |
          ls -l vpn-client/out/
          file vpn-client/out/dsvpn-${{ matrix.arch }}.tgz

      # Checks the ELF, that it executes under qemu-<arch>-static, and — the
      # part that matters — that the no-system-changes patch is present in the
      # binary's strings. Without that last check a patch which silently
      # stopped matching upstream would ship a client that rewrites the
      # device's routing table.
      #
      # Run under sudo so the x86_64 job also brings up a real tunnel between
      # two network namespaces and pings across it; every other architecture
      # skips that step by itself.
      - name: Verify
        timeout-minutes: 5
        run: sudo vpn-client/verify.sh ${{ matrix.arch }} vpn-client/out/dsvpn-${{ matrix.arch }}.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: dsvpn-${{ matrix.arch }}
          path: |
            vpn-client/out/dsvpn-${{ matrix.arch }}.tgz
            vpn-client/out/dsvpn-${{ matrix.arch }}.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish vpn-client release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/vpn-client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tgz' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -l release/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*
